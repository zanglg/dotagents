<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="744" viewBox="0 0 1040 744" role="img" aria-labelledby="title desc">
  <title id="title">03  调度器：队列实例与注册类型</title>
  <desc id="desc">一个 request_queue 可以没有调度器或有一个 elevator_queue。多个队列调度器实例可以引用同一个注册的 elevator_type。</desc>
  <metadata>Source: /Volumes/workspace/linux; v7.3-rc2-27-g893e11787f78. Initialized blk-mq topology, excluding teardown and reconfiguration transients. Ratios are source:target along each arrow. Arrows denote structural association, not I/O flow. Solid borders denote modeled objects; dashed arrows denote explicitly optional scheduler associations. Blue emphasizes the local subject, not selection.</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#6D7881"/></marker>
    <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #3F474E; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle, .note { font-size: 14px; fill: #626D76; }
    .card rect { fill: #F8FAFB; stroke: #7C8791; stroke-width: 1.5; }
    .card text { fill: #3F474E; }
    .core rect { fill: #DFE9F2; stroke: #587795; stroke-width: 2; }
    .core text { fill: #465E73; }
    .name { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; }
    .body { font-size: 16px; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 14px; }
    .relation { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; fill: #3F474E; }
    .field { font-family: Menlo, Consolas, monospace; font-size: 14px; fill: #626D76; }
    .line { fill: none; stroke: #6D7881; stroke-width: 2; stroke-linejoin: round; stroke-linecap: butt; }
    .optional { stroke-dasharray: 6 4; }
</style>
  </defs>
  <rect width="1040" height="744" fill="#FFFFFF"/>
  <text class="title" x="48" y="52" text-anchor="start">03  调度器：队列实例与注册类型</text>
  <text class="subtitle" x="48" y="84" text-anchor="start">区分每队列的 elevator_queue 与模块级注册的 elevator_type；none 不是一个实例对象。</text>
  <path class="line optional" d="M408 208 H632" marker-end="url(#arrow)"/>
<path class="line" d="M804 272 V440" marker-end="url(#arrow)"/>
<text class="relation" x="520" y="190" text-anchor="middle">1:0..1</text>
<text class="field" x="520" y="234" text-anchor="middle">q.elevator</text>
<text class="relation" x="820" y="338" text-anchor="start">N:1</text>
<text class="field" x="820" y="382" text-anchor="start">eq.type</text>
<g class="card">
<rect x="64" y="144" width="344" height="128" rx="8"/>
<text class="name" x="84" y="176" text-anchor="start">request_queue</text>
<text class="body" x="84" y="206" text-anchor="start">选择调度器或使用 none</text>
<text class="code" x="84" y="231" text-anchor="start">elevator</text>
<text class="body" x="84" y="256" text-anchor="start">虚线：仅选择调度器时存在</text>
</g>
<g class="card core">
<rect x="632" y="144" width="344" height="128" rx="8"/>
<text class="name" x="652" y="176" text-anchor="start">elevator_queue</text>
<text class="body" x="652" y="206" text-anchor="start">每队列独立的调度器实例</text>
<text class="code" x="652" y="231" text-anchor="start">type / elevator_data / et</text>
<text class="body" x="652" y="256" text-anchor="start">挂接后跨多次 I/O 复用</text>
</g>
<g class="card">
<rect x="632" y="440" width="344" height="128" rx="8"/>
<text class="name" x="652" y="472" text-anchor="start">elevator_type</text>
<text class="body" x="652" y="502" text-anchor="start">模块注册的调度算法类型</text>
<text class="code" x="652" y="527" text-anchor="start">ops / elevator_name / list</text>
<text class="body" x="652" y="552" text-anchor="start">例如 mq-deadline、BFQ</text>
</g>
<text class="body" x="84" y="372" text-anchor="start">类型注册 ≠ 队列挂接</text>
<text class="code" x="84" y="412" text-anchor="start">elv_register(type)</text>
<text class="body" x="84" y="444" text-anchor="start">将算法加入全局注册表。</text>
<text class="code" x="84" y="488" text-anchor="start">blk_mq_init_sched(q, ...)</text>
<text class="body" x="84" y="520" text-anchor="start">为具体队列初始化调度实例。</text>
  <text class="note" x="64" y="614" text-anchor="start">一个已注册类型可有 0..N 个实例；每个已挂接实例仅属于一个队列、引用一个类型。</text><text class="note" x="64" y="640" text-anchor="start">none 时 q-&gt;elevator == NULL；切换调度器会替换实例，但不会为每次 I/O 创建实例。</text><text class="note" x="64" y="666" text-anchor="start">elevator_data 为算法私有数据；hctx-&gt;sched_data 可保存算法的每硬件队列数据，此处不展开。</text>
  <path d="M64 702 H96" class="line" marker-end="url(#arrow)"/>
  <text class="note" x="108" y="707" text-anchor="start">结构关联（非 I/O 流程）；数量比按箭头起点:终点读取。</text>
  <text class="note" x="976" y="707" text-anchor="end">Linux 893e11787f78</text>
</svg>
