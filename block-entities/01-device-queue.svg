<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="744" viewBox="0 0 1040 744" role="img" aria-labelledby="title desc">
  <title id="title">01  设备、分区与请求队列</title>
  <desc id="desc">一个 gendisk 对应一个 request_queue，并包含整盘及分区的多个 block_device。一个 blk_mq_tag_set 可以供多个 request_queue 共享。</desc>
  <metadata>Source: /Volumes/workspace/linux; v7.3-rc2-27-g893e11787f78. Initialized blk-mq topology, excluding teardown and reconfiguration transients. Ratios are source:target along each arrow. Arrows denote structural association, not I/O flow. Solid borders denote modeled objects; dashed arrows denote explicitly optional scheduler associations. Blue emphasizes the local subject, not selection.</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#6D7881"/></marker>
    <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #3F474E; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle, .note { font-size: 14px; fill: #626D76; }
    .card rect { fill: #F8FAFB; stroke: #7C8791; stroke-width: 1.5; }
    .card text { fill: #3F474E; }
    .core rect { fill: #DFE9F2; stroke: #587795; stroke-width: 2; }
    .core text { fill: #465E73; }
    .name { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; }
    .body { font-size: 16px; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 14px; }
    .relation { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; fill: #3F474E; }
    .field { font-family: Menlo, Consolas, monospace; font-size: 14px; fill: #626D76; }
    .line { fill: none; stroke: #6D7881; stroke-width: 2; stroke-linejoin: round; stroke-linecap: butt; }
    .optional { stroke-dasharray: 6 4; }
</style>
  </defs>
  <rect width="1040" height="744" fill="#FFFFFF"/>
  <text class="title" x="48" y="52" text-anchor="start">01  设备、分区与请求队列</text>
  <text class="subtitle" x="48" y="84" text-anchor="start">范围：已初始化的 blk-mq 设备；长期指配置期建立、跨多次 I/O 复用，不表示永不改变。</text>
  <path class="line" d="M408 208 H632" marker-end="url(#arrow)"/>
<path class="line" d="M236 272 V440" marker-end="url(#arrow)"/>
<path class="line" d="M804 440 V272" marker-end="url(#arrow)"/>
<text class="relation" x="520" y="190" text-anchor="middle">1:1</text>
<text class="field" x="520" y="234" text-anchor="middle">disk.queue / q.disk</text>
<text class="relation" x="252" y="338" text-anchor="start">1:N</text>
<text class="field" x="252" y="382" text-anchor="start">part_tbl</text>
<text class="relation" x="820" y="338" text-anchor="start">1:N</text>
<text class="field" x="820" y="382" text-anchor="start">tag_list</text>
<g class="card">
<rect x="64" y="144" width="344" height="128" rx="8"/>
<text class="name" x="84" y="176" text-anchor="start">gendisk</text>
<text class="body" x="84" y="206" text-anchor="start">整盘的块设备描述</text>
<text class="code" x="84" y="231" text-anchor="start">queue / part0 / part_tbl</text>
<text class="body" x="84" y="256" text-anchor="start">分配后由 device_add_disk() 注册</text>
</g>
<g class="card core">
<rect x="632" y="144" width="344" height="128" rx="8"/>
<text class="name" x="652" y="176" text-anchor="start">request_queue</text>
<text class="body" x="652" y="206" text-anchor="start">每个磁盘的队列与策略入口</text>
<text class="code" x="652" y="231" text-anchor="start">disk / tag_set / elevator</text>
<text class="body" x="652" y="256" text-anchor="start">同盘各分区共用此队列</text>
</g>
<g class="card">
<rect x="64" y="440" width="344" height="128" rx="8"/>
<text class="name" x="84" y="472" text-anchor="start">block_device</text>
<text class="body" x="84" y="502" text-anchor="start">一个整盘对象 + P 个分区对象</text>
<text class="code" x="84" y="527" text-anchor="start">bd_disk / bd_queue</text>
<text class="body" x="84" y="552" text-anchor="start">N = 1 + P；part0 为整盘对象</text>
</g>
<g class="card">
<rect x="632" y="440" width="344" height="128" rx="8"/>
<text class="name" x="652" y="472" text-anchor="start">blk_mq_tag_set</text>
<text class="body" x="652" y="502" text-anchor="start">驱动建立，可由多个队列共享</text>
<text class="code" x="652" y="527" text-anchor="start">tag_list / tags[] / map[] / ops</text>
<text class="body" x="652" y="552" text-anchor="start">各 q-&gt;tag_set 指向同一个 set</text>
</g>
  <text class="note" x="64" y="614" text-anchor="start">分区不另建 request_queue：bdev-&gt;bd_queue = bdev-&gt;bd_disk-&gt;queue。</text><text class="note" x="64" y="640" text-anchor="start">tag_set 的 1:N 按已挂接设备计；尚未挂接或全部卸载时，队列数可为 0。</text><text class="note" x="64" y="666" text-anchor="start">分区可后续增删；本图不包含 bio、单次 request、驱动私有结构或非 blk-mq 路径。</text>
  <path d="M64 702 H96" class="line" marker-end="url(#arrow)"/>
  <text class="note" x="108" y="707" text-anchor="start">结构关联（非 I/O 流程）；数量比按箭头起点:终点读取。</text>
  <text class="note" x="976" y="707" text-anchor="end">Linux 893e11787f78</text>
</svg>
