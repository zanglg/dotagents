<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="744" viewBox="0 0 1040 744" role="img" aria-labelledby="title desc">
  <title id="title">05  Scheduler Tag：调度器自己的资源池</title>
  <desc id="desc">一个 elevator_queue 拥有一个 elevator_tags。普通模式为每个 hctx 分配一个 scheduler tag 池；HCTX_SHARED 模式为本 request_queue 的所有 hctx 共用一个池。无调度器时 hctx 的 sched_tags 为空。</desc>
  <metadata>Source: /Volumes/workspace/linux; v7.3-rc2-27-g893e11787f78. Initialized blk-mq topology, excluding teardown and reconfiguration transients. Ratios are source:target along each arrow. Arrows denote structural association, not I/O flow. Solid borders denote modeled objects; dashed arrows denote explicitly optional scheduler associations. Blue emphasizes the local subject, not selection.</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#6D7881"/></marker>
    <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #3F474E; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle, .note { font-size: 14px; fill: #626D76; }
    .card rect { fill: #F8FAFB; stroke: #7C8791; stroke-width: 1.5; }
    .card text { fill: #3F474E; }
    .core rect { fill: #DFE9F2; stroke: #587795; stroke-width: 2; }
    .core text { fill: #465E73; }
    .name { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; }
    .body { font-size: 16px; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 14px; }
    .relation { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; fill: #3F474E; }
    .field { font-family: Menlo, Consolas, monospace; font-size: 14px; fill: #626D76; }
    .line { fill: none; stroke: #6D7881; stroke-width: 2; stroke-linejoin: round; stroke-linecap: butt; }
    .optional { stroke-dasharray: 6 4; }
</style>
  </defs>
  <rect width="1040" height="744" fill="#FFFFFF"/>
  <text class="title" x="48" y="52" text-anchor="start">05  Scheduler Tag：调度器自己的资源池</text>
  <text class="subtitle" x="48" y="84" text-anchor="start">与 Driver Tag 使用相同结构类型，但属于不同的池；本源码通过 elevator_tags 管理调度器 tag 资源。</text>
  <path class="line" d="M408 208 H632" marker-end="url(#arrow)"/>
<path class="line" d="M804 272 V440" marker-end="url(#arrow)"/>
<path class="line optional" d="M408 504 H632" marker-end="url(#arrow)"/>
<text class="relation" x="520" y="190" text-anchor="middle">1:1</text>
<text class="field" x="520" y="234" text-anchor="middle">eq.et</text>
<text class="relation" x="820" y="338" text-anchor="start">1:N / 1:1</text>
<text class="field" x="820" y="382" text-anchor="start">et.tags[]</text>
<text class="relation" x="520" y="486" text-anchor="middle">1:1 / N:1</text>
<text class="field" x="520" y="530" text-anchor="middle">hctx.sched_tags</text>
<g class="card">
<rect x="64" y="144" width="344" height="128" rx="8"/>
<text class="name" x="84" y="176" text-anchor="start">elevator_queue</text>
<text class="body" x="84" y="206" text-anchor="start">已挂接的调度器实例</text>
<text class="code" x="84" y="231" text-anchor="start">et / elevator_data</text>
<text class="body" x="84" y="256" text-anchor="start">none 时无此实例及其 tag 资源</text>
</g>
<g class="card">
<rect x="632" y="144" width="344" height="128" rx="8"/>
<text class="name" x="652" y="176" text-anchor="start">elevator_tags</text>
<text class="body" x="652" y="206" text-anchor="start">此源码版本的调度器 tag 容器</text>
<text class="code" x="652" y="231" text-anchor="start">nr_hw_queues / tags[]</text>
<text class="body" x="652" y="256" text-anchor="start">共享模式只在 tags[0] 存放池</text>
</g>
<g class="card">
<rect x="64" y="440" width="344" height="128" rx="8"/>
<text class="name" x="84" y="472" text-anchor="start">blk_mq_hw_ctx</text>
<text class="body" x="84" y="502" text-anchor="start">仅有调度器时引用右侧资源池</text>
<text class="code" x="84" y="527" text-anchor="start">sched_tags</text>
<text class="body" x="84" y="552" text-anchor="start">无调度器：sched_tags == NULL</text>
</g>
<g class="card core">
<rect x="632" y="440" width="344" height="128" rx="8"/>
<text class="name" x="652" y="472" text-anchor="start">blk_mq_tags</text>
<text class="body" x="652" y="502" text-anchor="start">Scheduler Tag 池</text>
<text class="code" x="652" y="527" text-anchor="start">bitmap_tags / rqs / static_rqs</text>
<text class="body" x="652" y="552" text-anchor="start">不等同于 hctx-&gt;tags 的 Driver 池</text>
</g>
  <text class="note" x="64" y="614" text-anchor="start">普通模式：et 到池为 1:N（N = et-&gt;nr_hw_queues）；每个 hctx 与自己的 scheduler 池为 1:1。</text><text class="note" x="64" y="640" text-anchor="start">HCTX_SHARED 模式：et 到池为 1:1；同队列多个 hctx 到池为 N:1，经 q-&gt;sched_shared_tags 引用。</text><text class="note" x="64" y="666" text-anchor="start">此共享仅限本 request_queue；不同队列的 scheduler 池不因共用 tag_set 而合并。</text>
  <path d="M64 702 H96" class="line" marker-end="url(#arrow)"/>
  <text class="note" x="108" y="707" text-anchor="start">结构关联（非 I/O 流程）；数量比按箭头起点:终点读取。</text>
  <text class="note" x="976" y="707" text-anchor="end">Linux 893e11787f78</text>
</svg>
