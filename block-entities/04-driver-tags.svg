<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="744" viewBox="0 0 1040 744" role="img" aria-labelledby="title desc">
  <title id="title">04  Driver Tag：集合共享与池共享</title>
  <desc id="desc">tag_set 关联多个 request_queue，各队列拥有独立 hctx。已映射 hctx 通过 tags 引用 set 中的 driver tag 池。同一 set 的多个队列可共享对应索引的池，HCTX_SHARED 进一步让不同索引共用一个池。</desc>
  <metadata>Source: /Volumes/workspace/linux; v7.3-rc2-27-g893e11787f78. Initialized blk-mq topology, excluding teardown and reconfiguration transients. Ratios are source:target along each arrow. Arrows denote structural association, not I/O flow. Solid borders denote modeled objects; dashed arrows denote explicitly optional scheduler associations. Blue emphasizes the local subject, not selection.</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#6D7881"/></marker>
    <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #3F474E; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle, .note { font-size: 14px; fill: #626D76; }
    .card rect { fill: #F8FAFB; stroke: #7C8791; stroke-width: 1.5; }
    .card text { fill: #3F474E; }
    .core rect { fill: #DFE9F2; stroke: #587795; stroke-width: 2; }
    .core text { fill: #465E73; }
    .name { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; }
    .body { font-size: 16px; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 14px; }
    .relation { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; fill: #3F474E; }
    .field { font-family: Menlo, Consolas, monospace; font-size: 14px; fill: #626D76; }
    .line { fill: none; stroke: #6D7881; stroke-width: 2; stroke-linejoin: round; stroke-linecap: butt; }
    .optional { stroke-dasharray: 6 4; }
</style>
  </defs>
  <rect width="1040" height="744" fill="#FFFFFF"/>
  <text class="title" x="48" y="52" text-anchor="start">04  Driver Tag：集合共享与池共享</text>
  <text class="subtitle" x="48" y="84" text-anchor="start">blk_mq_tag_set 是驱动配置集合；blk_mq_tags 是实际的 tag 位图与 request 池，两者不是同一结构。</text>
  <path class="line" d="M408 208 H632" marker-end="url(#arrow)"/>
<path class="line" d="M236 272 V440" marker-end="url(#arrow)"/>
<path class="line" d="M408 504 H632" marker-end="url(#arrow)"/>
<path class="line" d="M804 440 V272" marker-end="url(#arrow)"/>
<text class="relation" x="520" y="190" text-anchor="middle">1:N / 1:1</text>
<text class="field" x="520" y="234" text-anchor="middle">set.tags[i]</text>
<text class="relation" x="252" y="338" text-anchor="start">1:N</text>
<text class="field" x="252" y="382" text-anchor="start">tag_list</text>
<text class="relation" x="520" y="486" text-anchor="middle">1:H</text>
<text class="field" x="520" y="530" text-anchor="middle">q.queue_hw_ctx[]</text>
<text class="relation" x="820" y="338" text-anchor="start">N:1</text>
<text class="field" x="820" y="382" text-anchor="start">hctx.tags</text>
<g class="card">
<rect x="64" y="144" width="344" height="128" rx="8"/>
<text class="name" x="84" y="176" text-anchor="start">blk_mq_tag_set</text>
<text class="body" x="84" y="206" text-anchor="start">tag 池及 CPU 映射的配置集合</text>
<text class="code" x="84" y="231" text-anchor="start">tags[] / shared_tags</text>
<text class="body" x="84" y="256" text-anchor="start">由 blk_mq_alloc_tag_set() 建立</text>
</g>
<g class="card core">
<rect x="632" y="144" width="344" height="128" rx="8"/>
<text class="name" x="652" y="176" text-anchor="start">blk_mq_tags</text>
<text class="body" x="652" y="206" text-anchor="start">Driver Tag 池</text>
<text class="code" x="652" y="231" text-anchor="start">bitmap_tags / rqs / static_rqs</text>
<text class="body" x="652" y="256" text-anchor="start">可被多个队列的 hctx 共同引用</text>
</g>
<g class="card">
<rect x="64" y="440" width="344" height="128" rx="8"/>
<text class="name" x="84" y="472" text-anchor="start">request_queue</text>
<text class="body" x="84" y="502" text-anchor="start">挂接到同一个 tag_set</text>
<text class="code" x="84" y="527" text-anchor="start">tag_set / queue_hw_ctx[]</text>
<text class="body" x="84" y="552" text-anchor="start">H = q-&gt;nr_hw_queues</text>
</g>
<g class="card">
<rect x="632" y="440" width="344" height="128" rx="8"/>
<text class="name" x="652" y="472" text-anchor="start">blk_mq_hw_ctx</text>
<text class="body" x="652" y="502" text-anchor="start">hctx 自身不跨 request_queue 共享</text>
<text class="code" x="652" y="527" text-anchor="start">tags = set-&gt;tags[queue_num]</text>
<text class="body" x="652" y="552" text-anchor="start">向上的 N:1 仅计已有映射的 hctx</text>
</g>
  <text class="note" x="64" y="614" text-anchor="start">普通模式：set 到独立池为 1:N，N ≤ set-&gt;nr_hw_queues；无 CPU 映射的 hctx-&gt;tags 可为 NULL。</text><text class="note" x="64" y="640" text-anchor="start">BLK_MQ_F_TAG_QUEUE_SHARED：多个 request_queue 共享 set，同索引 hctx 引用同一个池。</text><text class="note" x="64" y="666" text-anchor="start">BLK_MQ_F_TAG_HCTX_SHARED：不同硬件队列索引也共用 set-&gt;shared_tags，set 到池为 1:1。</text>
  <path d="M64 702 H96" class="line" marker-end="url(#arrow)"/>
  <text class="note" x="108" y="707" text-anchor="start">结构关联（非 I/O 流程）；数量比按箭头起点:终点读取。</text>
  <text class="note" x="976" y="707" text-anchor="end">Linux 893e11787f78</text>
</svg>
