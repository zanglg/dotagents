<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1408" viewBox="0 0 1600 1408" role="img" aria-labelledby="title desc">
  <title id="title">Block 层长期实体关系总图</title>
  <desc id="desc">以 request_queue 为中心，整合 gendisk、block_device、blk_mq_tag_set、CPU 软件上下文、硬件上下文、调度器实例与类型，以及 Driver 和 Scheduler 两类 tag 资源池。所有关系使用单一直线段；箭头表示关联及数量关系的阅读方向，不表示 I/O 流程。虚线仅表示选用调度器时存在的关联。共享模式及数量例外见图内注释。</desc>
  <metadata>Source: /Volumes/workspace/linux, v7.3-rc4-606-gfd179f8a05be. The relevant definitions and initialization code are unchanged from 893e11787f78. Scope: initialized blk-mq topology, excluding teardown and reconfiguration transients. All thirteen entity associations are straight segments. Blue core fill emphasizes request_queue; paired light-blue cards identify distinct tag pools, not selected state. Solid borders identify modeled objects.</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6D7881"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #3F474E; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle, .body { font-size: 16px; }
      .subtitle, .note { fill: #626D76; }
      .note, .small { font-size: 14px; }
      .section { font-size: 16px; font-weight: 600; }
      .code, .field { font-family: Menlo, Consolas, monospace; font-size: 14px; }
      .field { fill: #626D76; }
      .name { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; }
      .ratio { font-family: Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; }
      .card rect { fill: #F8FAFB; stroke: #7C8791; stroke-width: 1.5; }
      .card text { fill: #3F474E; }
      .core rect { fill: #DFE9F2; stroke: #587795; stroke-width: 2; }
      .core text { fill: #465E73; }
      .pool rect { fill: #F1F4F6; stroke: #627789; }
      .pool text { fill: #50677B; }
      .edge, .legend-line { fill: none; stroke: #6D7881; stroke-width: 2; stroke-linecap: butt; stroke-linejoin: round; }
      .optional { stroke-dasharray: 6 4; }
      .divider { stroke: #CBD2D8; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1408" fill="#FFFFFF"/>
  <text class="title" x="48" y="48">Block 层长期实体关系总图</text>
  <text class="subtitle" x="48" y="80">初始化 / 注册期建立，跨多次 I/O 复用；以队列为中心整合设备、CPU 映射、调度器和 Tag 资源。</text>

  <!-- Structural associations: every entity edge is one straight segment. -->
  <g id="associations" marker-end="url(#arrow)">
    <path id="disk-bdev" class="edge" data-source="disk" data-target="bdev" d="M750 192 L850 192"/>
    <path id="disk-queue" class="edge" data-source="disk" data-target="queue" d="M600 256 L600 416"/>
    <path id="set-queue" class="edge" data-source="tag-set" data-target="queue" d="M320 256 L480 416"/>
    <path id="set-driver-tags" class="edge" data-source="tag-set" data-target="driver-tags" d="M200 256 L200 416"/>
    <path id="queue-scheduler" class="edge optional" data-source="queue" data-target="scheduler" d="M750 480 L1100 480"/>
    <path id="queue-ctx" class="edge" data-source="queue" data-target="ctx" d="M700 544 L820 616"/>
    <path id="queue-hctx" class="edge" data-source="queue" data-target="hctx" d="M600 544 L600 816"/>
    <path id="ctx-hctx" class="edge" data-source="ctx" data-target="hctx" d="M820 744 L700 816"/>
    <path id="hctx-driver-tags" class="edge" data-source="hctx" data-target="driver-tags" d="M480 816 L320 544"/>
    <path id="scheduler-type" class="edge" data-source="scheduler" data-target="scheduler-type-node" d="M1360 416 L1410 256"/>
    <path id="scheduler-container" class="edge" data-source="scheduler" data-target="scheduler-tag-container" d="M1260 544 L1260 816"/>
    <path id="container-scheduler-tags" class="edge" data-source="scheduler-tag-container" data-target="scheduler-tags" d="M1260 944 L1260 1104"/>
    <path id="hctx-scheduler-tags" class="edge optional" data-source="hctx" data-target="scheduler-tags" d="M750 904 L1100 1168"/>
  </g>

  <!-- Cardinalities are source:target along the arrow; N is local to each edge. -->
  <g id="relation-labels">
    <text class="ratio" x="800" y="174" text-anchor="middle">1:N</text>
    <text class="field" x="800" y="216" text-anchor="middle">part_tbl</text>

    <text class="ratio" x="616" y="320">1:1</text>
    <text class="field" x="616" y="344">disk.queue</text>
    <text class="field" x="616" y="368">q.disk</text>

    <text class="ratio" x="440" y="320">1:N</text>
    <text class="field" x="440" y="344">tag_list</text>

    <text class="ratio" x="216" y="320">1:N / 1:1</text>
    <text class="field" x="216" y="344">set.tags[i]</text>
    <text class="note" x="216" y="368">普通 / 共享</text>

    <text class="ratio" x="925" y="462" text-anchor="middle">1:0..1</text>
    <text class="field" x="925" y="508" text-anchor="middle">q.elevator</text>

    <text class="ratio" x="852" y="568">1:N</text>
    <text class="field" x="852" y="592">q.queue_ctx</text>

    <text class="ratio" x="584" y="668" text-anchor="end">1:H</text>
    <text class="field" x="584" y="692" text-anchor="end">q.queue_hw_ctx[]</text>

    <text class="ratio" x="840" y="776">N:1 / type</text>
    <text class="field" x="840" y="800">ctx.hctxs[type]</text>
    <text class="note" x="840" y="824">跨 type 可为 M:N</text>

    <text class="ratio" x="360" y="668" text-anchor="end">N:1</text>
    <text class="field" x="360" y="692" text-anchor="end">hctx.tags</text>
    <text class="note" x="360" y="716" text-anchor="end">仅计已映射的 hctx</text>

    <text class="ratio" x="1430" y="320">N:1</text>
    <text class="field" x="1430" y="344">eq.type</text>

    <text class="ratio" x="1276" y="668">1:1</text>
    <text class="field" x="1276" y="692">eq.et</text>

    <text class="ratio" x="1276" y="1012">1:H / 1:1</text>
    <text class="field" x="1276" y="1036">et.tags[]</text>
    <text class="note" x="1276" y="1060">普通 / 共享</text>

    <text class="ratio" x="1000" y="1008">1:1 / N:1</text>
    <text class="field" x="1000" y="1032">hctx.sched_tags</text>
    <text class="note" x="1000" y="1056">普通 / 共享；有调度器时</text>
  </g>

  <g id="tag-set" class="card">
    <rect x="50" y="128" width="300" height="128" rx="8"/>
    <text class="name" x="70" y="160">blk_mq_tag_set</text>
    <text class="body" x="70" y="190">驱动建立，可供多个队列共享</text>
    <text class="code" x="70" y="215">tags[] / map[] / tag_list</text>
    <text class="small" x="70" y="240">各队列的 q-&gt;tag_set 指向此集合</text>
  </g>
  <g id="disk" class="card">
    <rect x="450" y="128" width="300" height="128" rx="8"/>
    <text class="name" x="470" y="160">gendisk</text>
    <text class="body" x="470" y="190">整盘描述与分区注册入口</text>
    <text class="code" x="470" y="215">queue / part0 / part_tbl</text>
    <text class="small" x="470" y="240">与已关联的 request_queue 为 1:1</text>
  </g>
  <g id="bdev" class="card">
    <rect x="850" y="128" width="300" height="128" rx="8"/>
    <text class="name" x="870" y="160">block_device</text>
    <text class="body" x="870" y="190">整盘 part0 + P 个分区</text>
    <text class="code" x="870" y="215">bd_disk / bd_queue</text>
    <text class="small" x="870" y="240">N = 1 + P；共用所属磁盘的队列</text>
  </g>
  <g id="scheduler-type-node" class="card">
    <rect x="1260" y="128" width="300" height="128" rx="8"/>
    <text class="name" x="1280" y="160">elevator_type</text>
    <text class="body" x="1280" y="190">模块注册的调度算法类型</text>
    <text class="code" x="1280" y="215">elv_register() / ops</text>
    <text class="small" x="1280" y="240">一个已注册类型可有 0..N 个实例</text>
  </g>

  <g id="driver-tags" class="card pool">
    <rect x="50" y="416" width="300" height="128" rx="8"/>
    <text class="name" x="70" y="448">blk_mq_tags</text>
    <text class="body" x="70" y="478">Driver Tag 池</text>
    <text class="code" x="70" y="503">bitmap_tags / rqs / static_rqs</text>
    <text class="small" x="70" y="528">可被不同 request_queue 的 hctx 共享</text>
  </g>
  <g id="queue" class="card core">
    <rect x="450" y="416" width="300" height="128" rx="8"/>
    <text class="name" x="470" y="448">request_queue</text>
    <text class="body" x="470" y="478">每磁盘的队列与策略入口</text>
    <text class="code" x="470" y="503">tag_set / queue_ctx / elevator</text>
    <text class="code" x="470" y="528">queue_hw_ctx[] / nr_hw_queues</text>
  </g>
  <g id="scheduler" class="card">
    <rect x="1100" y="416" width="320" height="128" rx="8"/>
    <text class="name" x="1120" y="448">elevator_queue</text>
    <text class="body" x="1120" y="478">每队列独立的调度器实例</text>
    <text class="code" x="1120" y="503">type / elevator_data / et</text>
    <text class="small" x="1120" y="528">none 时 q-&gt;elevator == NULL</text>
  </g>

  <g id="ctx" class="card">
    <rect x="760" y="616" width="280" height="128" rx="8"/>
    <text class="name" x="780" y="648">blk_mq_ctx</text>
    <text class="body" x="780" y="678">每个 possible CPU 一个</text>
    <text class="code" x="780" y="703">cpu / queue / hctxs[type]</text>
    <text class="small" x="780" y="728">N = num_possible_cpus()</text>
  </g>
  <g id="hctx" class="card">
    <rect x="450" y="816" width="300" height="128" rx="8"/>
    <text class="name" x="470" y="848">blk_mq_hw_ctx</text>
    <text class="body" x="470" y="878">每硬件队列索引一个；不跨 q 共享</text>
    <text class="code" x="470" y="903">queue / ctxs[] / nr_ctx</text>
    <text class="small" x="470" y="928">H = q-&gt;nr_hw_queues</text>
  </g>
  <g id="scheduler-tag-container" class="card">
    <rect x="1100" y="816" width="320" height="128" rx="8"/>
    <text class="name" x="1120" y="848">elevator_tags</text>
    <text class="body" x="1120" y="878">此队列调度器的 Tag 资源容器</text>
    <text class="code" x="1120" y="903">nr_hw_queues / tags[]</text>
    <text class="small" x="1120" y="928">共享模式仅在 tags[0] 存放池</text>
  </g>
  <g id="scheduler-tags" class="card pool">
    <rect x="1100" y="1104" width="320" height="128" rx="8"/>
    <text class="name" x="1120" y="1136">blk_mq_tags</text>
    <text class="body" x="1120" y="1166">Scheduler Tag 池</text>
    <text class="code" x="1120" y="1191">bitmap_tags / rqs / static_rqs</text>
    <text class="small" x="1120" y="1216">与 Driver 池同类型，但为不同实例</text>
  </g>

  <!-- Local notes retain exceptions without duplicating the graph. -->
  <g id="sharing-notes">
    <text class="section" x="64" y="808">两种共享，不要混淆</text>
    <text class="code" x="64" y="840">TAG_QUEUE_SHARED</text>
    <text class="note" x="64" y="864">多个 queue 共用一个 tag_set；</text>
    <text class="note" x="64" y="888">同索引 hctx 可引用同一个 Driver 池。</text>
    <text class="code" x="64" y="928">TAG_HCTX_SHARED</text>
    <text class="note" x="64" y="952">不同硬件队列索引也共享一个池。</text>
  </g>
  <g id="quantity-notes">
    <text class="section" x="64" y="1024">数量与边界条件</text>
    <text class="note" x="64" y="1056">“普通 / 共享”指 BLK_MQ_F_TAG_HCTX_SHARED 未设置 / 已设置；两个共享标志均以 BLK_MQ_F_ 开头。</text>
    <text class="note" x="64" y="1084">Driver 独立池数 N ≤ set-&gt;nr_hw_queues；无 CPU 映射的 hctx-&gt;tags 可为 NULL。</text>
    <text class="note" x="64" y="1112">Scheduler 池只在同一 request_queue 内共享，不因共用 tag_set 而跨队列合并。</text>
    <text class="note" x="64" y="1140">CPU 映射依据 set-&gt;map[type].mq_map[cpu]；固定 type 为 N:1，跨类型整体可为 M:N。</text>
    <text class="note" x="64" y="1168">tag_set 可暂时没有挂接队列；图中实例关联按已挂接 / 已映射对象计，不含重配置过渡态。</text>
    <text class="note" x="64" y="1196">不画 bio、单次 I/O request 及驱动私有结构；分区、队列映射和调度器可以后续重配置。</text>
  </g>

  <path class="divider" d="M48 1264 H1552"/>
  <path class="legend-line" d="M64 1304 L96 1304" marker-end="url(#arrow)"/>
  <text class="note" x="108" y="1309">结构关联，不是 I/O 执行流程</text>
  <path class="legend-line optional" d="M440 1304 L472 1304" marker-end="url(#arrow)"/>
  <text class="note" x="484" y="1309">仅有调度器时存在</text>
  <text class="note" x="1552" y="1309" text-anchor="end">Linux fd179f8a05be · 统一总图</text>
  <text class="note" x="64" y="1340">数量比按箭头起点:终点读取；N 是各关系的局部数量，H 是所属队列的硬件上下文数；有调度器时，et 的 H 与该队列一致。</text>
  <text class="note" x="64" y="1368">本图展示初始化后持续复用的核心实体，不是所有 block 子系统结构的穷举；源码依据与完整例外见同目录 README.md。</text>
</svg>
