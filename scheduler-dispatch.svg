<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840" role="img" aria-labelledby="title desc">
  <title id="title">Scheduler and generic dispatch flow</title>
  <desc id="desc">With a scheduler attached, allocate a scheduler tag. Ordinary scheduled I/O sets RQF_USE_SCHED, enters scheduler pending structures, and is selected by policy before dispatch_request() returns rq. Flush and passthrough requests do not set RQF_USE_SCHED and bypass those scheduler structures. Both paths enter the generic dispatch domain for budget, driver tag, and retry handling before reaching the driver.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6D7881"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
      .card rect { fill: #F8FAFB; stroke: #7C8791; stroke-width: 1.5; }
      .card text { fill: #3F474E; }
      .core rect { fill: #DFE9F2; stroke: #587795; stroke-width: 2; }
      .core text { fill: #465E73; }
      .heading { font-size: 18px; font-weight: 600; }
      .body { font-size: 16px; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 14px; }
      .label { fill: #626D76; font-size: 16px; text-anchor: start; }
      .connector { fill: none; stroke: #6D7881; stroke-width: 2; stroke-linecap: butt; stroke-linejoin: round; }
      .junction { fill: #6D7881; }
    </style>
  </defs>

  <!-- Solid borders identify modeled stages; solid arrows show request flow.
       Blue marks the shared dispatch stage, not a selected or active state.
       Orthogonal split/merge lanes preserve the two aligned branch ports. -->
  <rect width="840" height="840" fill="#FFFFFF"/>

  <g class="connector">
    <path d="M420 80 V120" marker-end="url(#arrow)"/>
    <path d="M420 176 V208"/>
    <path d="M420 208 H220 V240" marker-end="url(#arrow)"/>
    <path d="M420 208 H620 V240" marker-end="url(#arrow)"/>
    <path d="M220 320 V376" marker-end="url(#arrow)"/>
    <path d="M220 440 V504" marker-end="url(#arrow)"/>
    <path d="M220 568 V608 H420"/>
    <path d="M620 320 V608 H420"/>
    <path d="M420 608 V640" marker-end="url(#arrow)"/>
    <path d="M420 720 V760" marker-end="url(#arrow)"/>
  </g>
  <g class="junction">
    <circle cx="420" cy="208" r="2"/>
    <circle cx="420" cy="608" r="2"/>
  </g>

  <g class="card">
    <rect x="264" y="32" width="312" height="48" rx="8"/>
    <text class="heading" x="420" y="62">scheduler attached</text>
  </g>
  <g class="card">
    <rect x="248" y="120" width="344" height="56" rx="8"/>
    <text class="heading" x="420" y="155">allocate scheduler tag</text>
  </g>

  <g class="card">
    <rect x="48" y="240" width="344" height="80" rx="8"/>
    <text class="heading" x="220" y="271">ordinary scheduled I/O</text>
    <text class="code" x="220" y="298">set RQF_USE_SCHED</text>
  </g>
  <g class="card">
    <rect x="448" y="240" width="344" height="80" rx="8"/>
    <text class="heading" x="620" y="271">flush / passthrough</text>
    <text class="code" x="620" y="298">no RQF_USE_SCHED</text>
  </g>

  <g class="card">
    <rect x="48" y="376" width="344" height="64" rx="8"/>
    <text class="heading" x="220" y="415">scheduler pending structures</text>
  </g>
  <text class="label" x="236" y="478">policy selects</text>
  <g class="card">
    <rect x="48" y="504" width="344" height="64" rx="8"/>
    <text class="code" x="220" y="541">dispatch_request() returns rq</text>
  </g>

  <g class="core">
    <rect x="240" y="640" width="360" height="80" rx="8"/>
    <text class="heading" x="420" y="671">generic dispatch domain</text>
    <text class="body" x="420" y="698">budget + driver tag + retry</text>
  </g>
  <g class="card">
    <rect x="324" y="760" width="192" height="48" rx="8"/>
    <text class="heading" x="420" y="790">driver</text>
  </g>
</svg>
